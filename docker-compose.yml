services:
  db:
    image: postgis/postgis:16-3.4
    container_name: dewijateng_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-dewijateng}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - dewijateng_pgdata:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/01-init-db.sql:ro
      - ./docker/seed-demo.sql:/docker-entrypoint-initdb.d/02-seed-demo.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-dewijateng}"]
      interval: 3s
      timeout: 3s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: dewijateng_adminer
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8088:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db

volumes:
  dewijateng_pgdata:
    name: dewijateng_pgdata
